<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extravaganza logo</title>
<style>
/* ============================================================
   Extravaganza logo (v4, final font) — shell launch + burst-in
   Burst origin (viewBox units): 101.51, 137.79
   Sequence: shell rises -> flash -> ring -> burst -> wordmark -> tagline
   Runtime: ~4.4s
   ============================================================ */

/* html only gets height: 100% (NOT display: flex — making html a flex
   container too would shrink body, its flex item, to fit the svg's
   intrinsic width instead of filling the viewport/iframe it's loaded
   into, undermining the width: 100% below and the centering). */
html {
  height: 100%;
}

body {
  margin: 0;
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ex-logo {
  width: 100%;
  max-width: 610px;
  height: auto;
  /* The shell starts below the viewBox and the burst overshoots above it.
     `visible` lets both spill rather than clip — leave ~12% breathing room
     around the logo, and a little extra underneath for the launch. */
  overflow: visible;

  /* ---- TUNING KNOBS -------------------------------------- */
  --launch: .85s;      /* how long the shell takes to rise */
  --launch-from: 140px;/* how far below the burst centre it starts */
  --ring-scale: .34;   /* how small the rays start */
  --ring-radius: 18;   /* radius of the starting circle, in viewBox units */
  --ring-uniform: .68; /* 0 = natural length differences, 1 = fully uniform */
  --boom: 1.18;        /* how far past final position the rays fly */
  --settle: .985;      /* slight pull-in before resting (1 = no bounce) */
  --burst-dur: 2.7s;   /* the burst itself */
  --text-start: 1.85s; /* when EXTRAVAGANZA begins, measured from the burst */
  /* This font sits ~4.5 units lower than the two interim fonts, so the
     4px lift from v1 is back. Headroom to the ray above is 3.9 units;
     raising this much further collides. */
  --text-lift: 4px;
  --fw1-delay: 2.55s;  /* first background firework */
  --fw2-delay: 3.3s;   /* second one */
  --fw3-delay: 2s;     /* third, top-left — fires first of the three */
  --fw-peak: .45;      /* their brightest opacity — keep them behind the logo */
}

/* --- background fireworks: small, dim, behind everything ----
   Drawn first in the markup so they sit at the back. Like .flash they
   are hidden at rest and use `forwards`, since their bright moment is a
   mid-animation keyframe rather than the 0% one. fill-box centres each
   group on its own bounding box, so they expand from their own middle. */
.ex-logo .bgfw {
  transform-box: fill-box;
  transform-origin: center;
  opacity: 0;
  animation: ex-bgfw 1.5s cubic-bezier(.12, .7, .3, 1) forwards;
}

.ex-logo .bgfw--1 { animation-delay: var(--fw1-delay); }
.ex-logo .bgfw--2 { animation-delay: var(--fw2-delay); animation-duration: 1.7s; }
.ex-logo .bgfw--3 { animation-delay: var(--fw3-delay); animation-duration: 1.6s; }

@keyframes ex-bgfw {
  0%   { opacity: 0;               transform: scale(.12) rotate(-12deg); }
  18%  { opacity: var(--fw-peak);  }
  100% { opacity: 0;               transform: scale(1.15) rotate(0deg); }
}

/* --- 0. the shell: rises, decelerating, then snuffs out ------ */
.ex-logo .shell {
  transform-box: view-box;
  transform-origin: 101.51px 137.79px;
  animation: ex-launch var(--launch) cubic-bezier(.12, .6, .3, 1) both;
}

@keyframes ex-launch {
  0%   { opacity: 0; transform: translateY(var(--launch-from)); }
  14%  { opacity: 1; }
  92%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(0); }
}

/* The trail shortens as the shell slows. fill-box + `center top` puts the
   origin at the head, so it retracts upward into it rather than shrinking
   toward its own middle. fill-box also keeps this correct inside the
   already-transformed .shell group. */
.ex-logo .shell-trail {
  transform-box: fill-box;
  transform-origin: center top;
  animation: ex-trail var(--launch) cubic-bezier(.12, .6, .3, 1) both;
}

@keyframes ex-trail {
  0%   { opacity: .5; transform: scaleY(1); }
  100% { opacity: 0;  transform: scaleY(.2); }
}

/* --- the pop at the top of the climb ------------------------ */
.ex-logo .flash {
  transform-box: view-box;
  transform-origin: 101.51px 137.79px;

  /* Hidden until its turn. This element is the one exception to `both`:
     its 0% keyframe is bright (opacity .9), so backwards-filling during
     the delay would park a lit dot at the burst centre for the whole
     climb. `forwards` + a base opacity of 0 keeps it dark until it fires,
     then holds the faded-out end state. */
  opacity: 0;
  animation: ex-flash .5s ease-out forwards;
  animation-delay: calc(var(--launch) - .06s);
}

@keyframes ex-flash {
  0%   { opacity: .9; transform: scale(.2); }
  100% { opacity: 0;  transform: scale(3.2); }
}

/* --- 1 + 2. the bursts, held until the shell lands ---------- */
.ex-logo .ray {
  transform-box: view-box;
  transform-origin: 101.51px 137.79px;

  --kx: calc(1 + (var(--k) - 1) * var(--ring-uniform));
  --tx: calc((var(--ring-radius) - var(--mid) * var(--ring-scale) * var(--kx)) * var(--ux) * 1px);
  --ty: calc((var(--ring-radius) - var(--mid) * var(--ring-scale) * var(--kx)) * var(--uy) * 1px);

  animation: ex-burst var(--burst-dur) both;
  animation-delay: calc(var(--launch) + var(--i) * 7ms);
}

@keyframes ex-burst {
  /* rotate(--tgt) and rotate(-(--tgt)) sandwich the scaleX so it stretches
     each ray along ITS OWN axis — length without width. At scaleX(1) the
     rotations cancel and the chain collapses to a plain scale. */
  0% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty)) rotate(var(--tgt)) scaleX(var(--kx))
               rotate(calc(var(--r) - var(--tgt) - 7deg)) scale(var(--ring-scale));
    animation-timing-function: linear;
  }
  8% {
    opacity: 1;
    transform: translate(var(--tx), var(--ty)) rotate(var(--tgt)) scaleX(var(--kx))
               rotate(calc(var(--r) - var(--tgt) - 7deg)) scale(var(--ring-scale));
    animation-timing-function: cubic-bezier(.4, 0, .6, 1);
  }
  38% {
    opacity: 1;
    transform: translate(var(--tx), var(--ty)) rotate(var(--tgt)) scaleX(var(--kx))
               rotate(calc(var(--r) - var(--tgt))) scale(calc(var(--ring-scale) * 1.12));
    animation-timing-function: cubic-bezier(.12, .85, .3, 1);
  }
  58% {
    transform: translate(0, 0) rotate(var(--tgt)) scaleX(1)
               rotate(calc(var(--tgt) * -1)) scale(var(--boom));
    animation-timing-function: cubic-bezier(.4, 0, .3, 1);
  }
  76% {
    transform: translate(0, 0) rotate(var(--tgt)) scaleX(1)
               rotate(calc(var(--tgt) * -1)) scale(var(--settle));
    animation-timing-function: ease-out;
  }
  100% {
    opacity: 1;
    transform: translate(0, 0) rotate(var(--tgt)) scaleX(1)
               rotate(calc(var(--tgt) * -1)) scale(1);
  }
}

/* --- 3. EXTRAVAGANZA, letter by letter --------------------- */
.ex-logo .ltr {
  transform-box: view-box;
  transform: translateY(calc(var(--text-lift) * -1));
  animation: ex-rise .6s ease-out both;
  animation-delay: calc(var(--launch) + var(--text-start) + var(--n) * 55ms);
}

/* --- 4. the tagline ---------------------------------------- */
.ex-logo .tag {
  transform-box: view-box;
  transform: translateY(calc(var(--text-lift) * -1));
  animation: ex-rise .75s ease-out both;
  animation-delay: calc(var(--launch) + var(--text-start) + .9s);
}

@keyframes ex-rise {
  from { opacity: 0; transform: translateY(calc(var(--text-lift) * -1 + 5px)); }
  to   { opacity: 1; transform: translateY(calc(var(--text-lift) * -1)); }
}

/* --- replay gate ------------------------------------------- */
.ex-logo:not(.is-playing) .bgfw,
.ex-logo:not(.is-playing) .shell,
.ex-logo:not(.is-playing) .flash,
.ex-logo:not(.is-playing) .ray,
.ex-logo:not(.is-playing) .ltr,
.ex-logo:not(.is-playing) .tag { animation: none; opacity: 0; }

/* --- accessibility ----------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  /* the shell and flash are purely transient — drop them entirely */
  .ex-logo .shell,
  .ex-logo .flash,
  .ex-logo .bgfw { display: none; }

  .ex-logo .ray,
  .ex-logo .ltr,
  .ex-logo .tag,
  .ex-logo:not(.is-playing) .ray,
  .ex-logo:not(.is-playing) .ltr,
  .ex-logo:not(.is-playing) .tag {
    animation: none;
    opacity: 1;
    transform: none;
  }
  .ex-logo .ltr,
  .ex-logo .tag,
  .ex-logo:not(.is-playing) .ltr,
  .ex-logo:not(.is-playing) .tag {
    transform: translateY(calc(var(--text-lift) * -1));
  }
}
</style>
</head>

<script>
const logo = document.querySelector('.ex-logo');

function play() {
  logo.classList.remove('is-playing');
  logo.getBoundingClientRect();   // <svg> has no offsetWidth; this flushes style
  logo.classList.add('is-playing');
  if (logo.getAnimations) {
    logo.getAnimations({ subtree: true }).forEach(a => { a.cancel(); a.play(); });
  }
}

// Plays once when the logo scrolls into view.
// Replace with a bare play() to fire on load instead.
new IntersectionObserver((entries, obs) => {
  entries.forEach(e => {
    if (e.isIntersecting) { play(); obs.unobserve(e.target); }
  });
}, { threshold: .4 }).observe(logo);
</script>
