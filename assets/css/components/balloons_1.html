<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balloon release</title>
<style>
html, body { margin:0; height:100%; }

/* The section the balloons live in. Needs position:relative + overflow:hidden.
   Height/background are yours — the balloons add no background of their own. */
.exb-section{
  position:relative;
  overflow:hidden;
  min-height:100%;
}

.exb{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;

  --exb-travel:100vh;  /* how far up they go */
  --exb-dur:3s;        /* base flight time — lower is faster */
  --exb-scale:0.5;     /* overall size */
}

.exb-b{
  position:absolute;
  width:calc(var(--exb-w) * var(--exb-scale));
  will-change:transform,opacity;
}

.exb-drift,.exb-sway{will-change:transform}

/* At rest: bunched, each leaning out from the shared hold point. */
.exb-b svg{
  display:block;
  width:100%;
  height:auto;
  transform-origin:50% 72%;
  rotate:var(--exb-r1);
}

/* Released. The .exb--go class is added by the observer at the bottom. */
.exb--go .exb-b       {animation:exb-rise  var(--exb-t) var(--exb-delay) both}
.exb--go .exb-drift   {animation:exb-drift var(--exb-t) cubic-bezier(.2,.6,.35,1) var(--exb-delay) both}
.exb--go .exb-sway    {animation:exb-sway  var(--exb-sd) ease-in-out infinite}
.exb--go .exb-b svg   {animation:exb-tilt  var(--exb-td) ease-in-out infinite alternate}

/* Per-balloon character. Largest sits in front and lowest; the smaller two are
   raised and offset so they clear its silhouette. Lean matches drift direction. */
.exb-1{
  --exb-w:110px; --exb-t:calc(var(--exb-dur) * 1);    --exb-delay:0s;
  --exb-x:115px; --exb-s:5px; --exb-sd:.9s; --exb-td:.85s;
  --exb-r1:2deg; --exb-r2:9deg;
  left:calc(50% - 60px); bottom:calc(14px * var(--exb-scale));
  color:#684D9F; z-index:3;
}
.exb-2{
  --exb-w:88px;  --exb-t:calc(var(--exb-dur) * 1.06); --exb-delay:.04s;
  --exb-x:-130px; --exb-s:6px; --exb-sd:1.05s; --exb-td:1s;
  --exb-r1:-11deg; --exb-r2:-4deg;
  left:calc(50% - 118px); bottom:calc(66px * var(--exb-scale));
  color:#B43DB4; z-index:2;
}
.exb-3{
  --exb-w:70px;  --exb-t:calc(var(--exb-dur) * 1.12); --exb-delay:.09s;
  --exb-x:40px;  --exb-s:4px; --exb-sd:.8s; --exb-td:.75s;
  --exb-r1:1deg; --exb-r2:7deg;
  left:calc(50% + 2px); bottom:calc(104px * var(--exb-scale));
  color:#9B86C4; z-index:1;
}

/* The release. Every segment starts and ends at matching velocity so there's
   no kink — the curve at 0% has a flat lead-in, which is what kills the snap. */
@keyframes exb-rise{
  0%   {opacity:1; transform:translateY(0);     animation-timing-function:cubic-bezier(.4,0,.6,1)}
  18%  {transform:translateY(-16px);            animation-timing-function:cubic-bezier(.45,0,.8,.75)}
  62%  {opacity:1}
  100% {opacity:0; transform:translateY(calc(var(--exb-travel) * -1))}
}

/* Lateral spread stays at zero until 18% — that pause is the hand opening.
   The curve leaves from a standstill so there's no sideways jerk on release. */
@keyframes exb-drift{
  0%,18% {transform:translateX(0); animation-timing-function:cubic-bezier(.3,0,.4,1)}
  100%   {transform:translateX(var(--exb-x))}
}

/* Full cycle through zero rather than alternating from an offset, so the
   resting pose and the first animated frame are the same position. */
@keyframes exb-sway{
  0%,100% {transform:translateX(0)}
  25%     {transform:translateX(var(--exb-s))}
  75%     {transform:translateX(calc(var(--exb-s) * -1))}
}

@keyframes exb-tilt{
  from {rotate:var(--exb-r1)}
  to   {rotate:var(--exb-r2)}
}

/* Narrower spread on phones so they don't clip off the sides. */
@media (max-width:640px){
  .exb-1{--exb-x:66px}
  .exb-2{--exb-x:-74px}
  .exb-3{--exb-x:23px}
}

/* Reduced motion: leave the bunch sitting there, no flight. */
@media (prefers-reduced-motion:reduce){
  .exb--go .exb-b,
  .exb--go .exb-drift,
  .exb--go .exb-sway,
  .exb--go .exb-b svg{animation:none}
}

</style>
</head>
<body>

<section class="exb-section">

    </div></div></div>
  </div>

</section>

<script>
// No auto-play here. Listens for a postMessage from the parent page instead
// of using its own IntersectionObserver — a scroll observer in here can't
// tell that the embed is sitting at opacity: 0 until the parent says it's
// actually visible (postMessage works across frames even under the
// file:// same-origin restrictions that block direct contentDocument
// access between separate local files).
window.addEventListener('message', function (e) {
  if (e.data === 'exb-play') {
    document.querySelectorAll('.exb').forEach(function (el) {
      el.classList.add('exb--go');
    });
  }
  if (e.data === 'exb-reset') {
    document.querySelectorAll('.exb').forEach(function (el) {
      el.classList.remove('exb--go');
    });
  }
});
</script>

</body>
</html>
