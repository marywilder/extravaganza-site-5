<svg xmlns="http://www.w3.org/2000/svg" class="sparkles" viewBox="0 0 208 187" width="208" height="187" fill="none" role="img" aria-label="Sparkles">
<style>
  .sparkles {
    /* pace: 1 = as authored, 1.5 = half again slower, .7 = faster */
    --pace: 1;
    /* how far the centre sparkle fades at its lowest point:
       0 = vanishes like the corners, 1 = barely moves */
    --lg-dip: .35;
  }

  .spark {
    transform-box: fill-box;
    transform-origin: center;
    animation-duration: calc(var(--dur) * var(--pace));
    animation-delay: calc(var(--delay) * var(--pace));
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-fill-mode: both;
  }

  .spark--sm { --spin: 45deg; animation-name: twinkle; }
  .spark--lg { --spin: 20deg; animation-name: twinkle-lg; }

  @keyframes twinkle {
    0%   { opacity: 0; transform: scale(0) rotate(calc(var(--spin) * -1)); }
    50%  { opacity: 1; transform: scale(1) rotate(0deg); }
    100% { opacity: 0; transform: scale(0) rotate(var(--spin)); }
  }

  @keyframes twinkle-lg {
    0% {
      opacity: calc(var(--lg-dip) * .85);
      transform: scale(calc(var(--lg-dip) * .95)) rotate(calc(var(--spin) * -1));
    }
    50% { opacity: 1; transform: scale(1) rotate(0deg); }
    100% {
      opacity: calc(var(--lg-dip) * .85);
      transform: scale(calc(var(--lg-dip) * .95)) rotate(var(--spin));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .spark { animation: none; opacity: 1; transform: none; }
  }
</style>
